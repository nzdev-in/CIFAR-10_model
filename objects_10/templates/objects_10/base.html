{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CIFAR-10 AI{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'base.css' %}">
</head>

<body>

    <!-- Ambient background -->
    <div class="ambient-background" aria-hidden="true">
        <div class="ambient-glow glow-one"></div>
        <div class="ambient-glow glow-two"></div>
        <div class="grid-overlay"></div>
    </div>


    <!-- Navigation -->
    <header class="site-header">

        <div class="header-inner">

            <a href="/" class="brand">

                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3.5 19 7.5v9L12 20.5 5 16.5v-9L12 3.5Z"></path>
                        <circle cx="12" cy="12" r="2.6"></circle>
                        <path d="M12 5.5V9.4M6.8 8.5l3.4 2M17.2 8.5l-3.4 2M12 18.5v-3.9"></path>
                    </svg>
                </div>

                <div class="brand-copy">
                    <span class="brand-name">CIFAR<span>10</span></span>
                    <span class="brand-subtitle">NEURAL CLASSIFIER</span>
                </div>

            </a>


            <div class="model-status">
                <span class="status-dot"></span>
                <span>MODEL ONLINE</span>
            </div>

        </div>

    </header>


    <!-- Main page -->
    <main class="site-main">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="footer-inner">

            <p>
                CIFAR-10 Image Classification
            </p>

            <div class="footer-tech">
                <span>PYTORCH</span>
                <span class="footer-dot"></span>
                <span>10 CLASSES</span>
                <span class="footer-dot"></span>
                <span>NEURAL NETWORK</span>
            </div>

        </div>

    </footer>

</body>

</html>
